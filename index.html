<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://docs.google.com; form-action https://docs.google.com; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Render Karşılaştırma</title>
<style>[hidden]{display:none!important}
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6a66;--line:#d9d6cf;--acc:#2f5d50;--btn:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#161615;--fg:#ecebe7;--mut:#a3a19b;--line:#3a3936;--acc:#7fb8a6;--btn:#222220}}
:root[data-theme=dark]{--bg:#161615;--fg:#ecebe7;--mut:#a3a19b;--line:#3a3936;--acc:#7fb8a6;--btn:#222220}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1500px;margin:0 auto;padding:12px 16px 32px}
h1{font-size:21px;margin:4px 0 8px}p{margin:8px 0;color:var(--mut)}h2{font-size:16px;margin:16px 0 6px}
.top{display:flex;justify-content:flex-end;gap:6px}.lang button{padding:4px 10px;font-size:13px}
.pair{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.pair figure{margin:0;position:relative}.pair img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:4px;background:#000;aspect-ratio:3/2;object-fit:contain}
.pair figcaption{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;padding:2px 10px;border-radius:4px}
.q{border-top:1px solid var(--line);padding:10px 0}.q b{display:block;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--fg);cursor:pointer;touch-action:manipulation}
button.sel{border-color:var(--acc);outline:2px solid var(--acc)}button:disabled{opacity:.45;cursor:default}
button.main{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600;width:100%}
textarea,select{font:inherit;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
textarea{min-height:56px}label{display:block;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}progress{flex:1;max-width:260px}
.note{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.credits{font-size:12px;color:var(--mut);margin-top:24px;border-top:1px solid var(--line);padding-top:8px}.credits p{margin:3px 0}
.pair img{cursor:zoom-in}
.zhint{font-size:13px;color:var(--mut);margin:2px 0 0}
#zoom{position:fixed;inset:0;background:#000;z-index:10;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain}
#zoom img{display:block;max-width:none;margin:auto;image-rendering:auto;user-select:none;-webkit-user-drag:none}
#zbar{position:fixed;top:8px;right:8px;z-index:11;display:flex;gap:6px}#zbar button{background:rgba(0,0,0,.65);color:#fff;border-color:#555;padding:8px 12px}
#zlab{position:fixed;top:8px;left:8px;z-index:11;background:rgba(0,0,0,.65);color:#fff;font-weight:700;padding:6px 12px;border-radius:6px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (min-width:760px){.pair{grid-template-columns:1fr 1fr}.opts{display:flex}.opts button{min-width:90px}button.main{width:auto}}
</style></head><body><main>
<div class="top lang" role="group" aria-label="Dil / Language"><button data-lang="tr">TR</button><button data-lang="en">EN</button></div>
<section id="intro">
<h1 data-i="title"></h1>
<p data-i="intro1"></p>
<p data-i="intro2"></p>
<h2 data-i="bg_h"></h2>
<label><span data-i="prof"></span><select id="prof"><option value="" data-i="none"></option><option value="arch" data-i="p_arch"></option><option value="int" data-i="p_int"></option><option value="photo" data-i="p_photo"></option><option value="viz" data-i="p_viz"></option><option value="student" data-i="p_student"></option><option value="other" data-i="p_other"></option></select></label>
<label><span data-i="exp"></span><select id="exp"><option value="" data-i="none"></option><option value="0-2">0–2</option><option value="3-5">3–5</option><option value="6-10">6–10</option><option value="10+">10+</option></select></label>
<div class="hp" aria-hidden="true"><label>Website <input id="hp" name="website" tabindex="-1" autocomplete="off"></label></div>
<h2 data-i="kvkk_h"></h2>
<p class="note" data-i="kvkk"></p>
<p><button id="start" class="main" data-i="start"></button></p>
</section>
<section id="run" hidden>
<div class="bar"><span id="cnt"></span><progress id="prog" value="0" max="1"></progress></div>
<div class="pair"><figure><img id="imL" alt="1"><figcaption>1</figcaption></figure><figure><img id="imR" alt="2"><figcaption>2</figcaption></figure></div>
<p class="zhint" data-i="zhint"></p>
<div class="q"><b data-i="q_real"></b><div class="opts" data-q="real"><button data-v="L">1</button><button data-v="R">2</button></div></div>
<div class="q"><b data-i="q_arch"></b><div class="opts" data-q="arch"><button data-v="L">1</button><button data-v="R">2</button></div></div>
<div class="q"><b data-i="q_why"></b><textarea id="why" maxlength="300"></textarea></div>
<div class="bar"><span></span><button id="next" class="main" disabled data-i="next"></button></div>
</section>
<section id="done" hidden><h1 data-i="thanks"></h1><p id="status"></p>
<div id="fallback" hidden><p data-i="fb"></p><textarea id="code" readonly rows="6"></textarea>
<p><button id="copy" data-i="copy"></button> <button id="retry" data-i="retry"></button></p></div></section>
<div id="zoom" hidden><img id="zimg" alt=""></div><div id="zbar" hidden><button id="z11">1:1</button><button id="zfit" data-i="zfit"></button><button id="zx" aria-label="close">✕</button></div><div id="zlab" hidden></div>
<div class="credits"><p data-i="cred_h"></p><div id="cred"></div></div>
</main>
<script>
"use strict";
const PAIRS=[{"id":"p01","a":"i011","b":"i032"},{"id":"p02","a":"i011","b":"i002"},{"id":"p03","a":"i019","b":"i020"},{"id":"p04","a":"i019","b":"i004"},{"id":"p05","a":"i016","b":"i015"},{"id":"p06","a":"i016","b":"i025"},{"id":"p07","a":"i033","b":"i026"},{"id":"p08","a":"i033","b":"i024"},{"id":"p09","a":"i028","b":"i017"},{"id":"p10","a":"i028","b":"i001"},{"id":"p11","a":"i003","b":"i005"},{"id":"p12","a":"i003","b":"i021"},{"id":"p13","a":"i018","b":"i010"},{"id":"p14","a":"i012","b":"i030"},{"id":"p15","a":"i012","b":"i023"},{"id":"p16","a":"i012","b":"i022"},{"id":"p17","a":"i012","b":"i027"},{"id":"p31","a":"i014","b":"i031"},{"id":"p32","a":"i007","b":"i029"},{"id":"p33","a":"i007","b":"i000"},{"id":"p40","a":"i006","b":"i013"},{"id":"p42","a":"i008","b":"i009"},{"id":"p45","a":"i003","b":"i012"}], CREDITS={"tr": ["“Italian Flat” — Flavio Della Tommasa (malapixel.com), CC BY, blender.org demo dosyalarından; bu çalışma için USD’ye dönüştürülüp değiştirildi.", "“Amazon Lumberyard Bistro, Open Research Content Archive (ORCA)”, Amazon Lumberyard, 2017, http://developer.nvidia.com/orca/amazon-lumberyard-bistro. CC BY 4.0, bu çalışma için dönüştürüldü.", "Mutfak: bu çalışma için hazırlanmış sahne (kendi parametrik modellerimiz; Poly Haven ve ambientCG CC0 dokuları; gökyüzü Poly Haven “Rolling Hills”, CC0)."], "en": ["“Italian Flat” by Flavio Della Tommasa (malapixel.com), CC BY, via blender.org demo files. Converted to USD and modified for this study.", "“Amazon Lumberyard Bistro, Open Research Content Archive (ORCA)”, Amazon Lumberyard, 2017, http://developer.nvidia.com/orca/amazon-lumberyard-bistro. CC BY 4.0, converted for this study.", "Kitchen: scene made for this study (our parametric models; CC0 textures from Poly Haven and ambientCG; sky: Poly Haven “Rolling Hills”, CC0)."]}, KIT="public-v2";
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSfZBasLbTuwL0jq9xy8COiKfeQhIAoOTXUTb4cfw0z_mgZGgA/formResponse", FIELD="entry.12284930";
const CHECKPOINTS=[15,30], NREP=2, MAXB=40000;
const T={
tr:{title:"Hangi görüntü daha iyi bir fotoğraf?",
intro1:"Bina ve iç mekân görüntülerinden oluşan {n} çift göreceksiniz. Her çift için iki soruyu yanıtlayın. Doğru ya da yanlış yanıt yok; ilk izleniminize güvenin. Yaklaşık 15–25 dakika sürer.",
intro2:"Klavyede 1 ve 2 tuşları sıradaki soruyu yanıtlar, Enter sonraki çifte geçer.",
bg_h:"Sizi tanıyalım (isteğe bağlı)",prof:"Mesleğiniz",exp:"Deneyim (yıl)",none:"Belirtmek istemiyorum",
p_arch:"Mimar",p_int:"İç mimar",p_photo:"Mimari fotoğrafçı",p_viz:"3D görselleştirme",p_student:"Tasarım öğrencisi",p_other:"Diğer",
kvkk_h:"Gizlilik (KVKK) bilgilendirmesi",
kvkk:"Yanıtlarınız anonimdir: adınızı, e-posta adresinizi ya da IP adresinizi istemiyor ve saklamıyoruz. Yalnızca yanıtlarınız, isteğe bağlı meslek/deneyim bilginiz, rastgele bir oturum kimliği ve süreler kaydedilir. Veriler yalnızca render kalitesini geliştirmek için kullanılır. Katılım gönüllüdür; istediğiniz an bırakabilirsiniz. Yanıtlar Google Forms aracılığıyla iletilir (15. ve 30. çiftten sonra ve sonda). Google bu iletim sırasında kendi gizlilik politikasına göre teknik bilgileri (ör. IP) işleyebilir, ancak biz bunları almıyoruz.",
start:"Başla",pair:"Çift {k} / {n}",
q_real:"Hangisi gerçek bir fotoğrafa daha çok benziyor?",q_arch:"Hangisi daha iyi bir mimari fotoğraf?",
q_why:"Ne ele veriyor? (isteğe bağlı)",why_ph:"ör. fazla temiz, ışık yanlış duruyor, çizgiler eğik",next:"Sonraki çift",
thanks:"Teşekkürler!",sent:"Yanıtlarınız gönderildi. Katkınız için çok teşekkür ederiz; bu sayfayı kapatabilirsiniz.",sending:"Gönderiliyor…",
fb:"Bağlantı yok gibi görünüyor. Aşağıdaki kodu kopyalayıp size bu bağlantıyı gönderen kişiye iletebilir ya da bağlantı gelince yeniden deneyebilirsiniz.",
zhint:"Ayrıntı için görüntüye dokunun: tam ekran, iki parmakla yakınlaştırma, 1:1 piksel.",zfit:"Sığdır",copy:"Kodu kopyala",copied:"Kopyalandı",retry:"Yeniden gönder",cred_h:"Sahne kaynakları ve lisanslar:"},
en:{title:"Which image is the better photograph?",
intro1:"You will see {n} pairs of images of buildings and interiors. For each pair, answer two questions. There are no right answers; go with your first impression. It takes about 15–25 minutes.",
intro2:"Keys: 1 and 2 answer the current question, Enter moves to the next pair.",
bg_h:"About you (optional)",prof:"Profession",exp:"Experience (years)",none:"Prefer not to say",
p_arch:"Architect",p_int:"Interior architect",p_photo:"Architectural photographer",p_viz:"3D visualisation",p_student:"Design student",p_other:"Other",
kvkk_h:"Privacy notice (KVKK)",
kvkk:"Your answers are anonymous: we do not ask for or store your name, email or IP address. We record only your answers, your optional profession/experience, a random session id and timings. The data is used only to improve render quality. Participation is voluntary and you can stop at any time. Answers are sent via Google Forms (after pairs 15 and 30, and at the end); Google may process technical data such as your IP under its own privacy policy, but we do not receive it.",
start:"Start",pair:"Pair {k} of {n}",
q_real:"Which looks more like a real photograph?",q_arch:"Which is the better architectural photograph?",
q_why:"What gives it away? (optional)",why_ph:"e.g. too clean, light looks wrong, lines tilt",next:"Next pair",
thanks:"Thank you!",sent:"Your answers have been sent. Thanks a lot for your help; you can close this page.",sending:"Sending…",
fb:"You seem to be offline. Copy the code below and send it to the person who shared this link, or retry when you are back online.",
zhint:"Tap an image for full screen: pinch to zoom, 1:1 native pixels.",zfit:"Fit",copy:"Copy code",copied:"Copied",retry:"Send again",cred_h:"Scene sources and licences:"}};
let LANG="tr";
const $=id=>document.getElementById(id);
const rnd=n=>{const b=new Uint8Array(n);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,"0")).join("")};
const SID=rnd(12), seed=crypto.getRandomValues(new Uint32Array(1))[0]>>>0;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(seed);
// trial sequence: all pairs shuffled with random sides, plus NREP pairs from the first half repeated later with sides swapped
const order=PAIRS.map((p,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
const seq=order.map(pi=>({pi,sw:R()<0.5,rep:0}));
const half=Math.floor(seq.length/2), srcPos=[];
while(srcPos.length<Math.min(NREP,half)){const q=Math.floor(R()*Math.min(half,20));if(!srcPos.includes(q))srcPos.push(q)}
srcPos.forEach(q=>{const s=seq[q],lo=Math.min(Math.max(q+10,half),seq.length),pos=lo+Math.floor(R()*(seq.length-lo+1));seq.splice(pos,0,{pi:s.pi,sw:!s.sw,rep:1})});
const N=seq.length;
let k=0,ans={},t0=0;
const S={v:KIT,sid:SID,seed,lang:LANG,ua:(navigator.language||"").slice(0,12),bg:{},hp:0,start:new Date().toISOString(),a:[]};
function tr(key){return T[LANG][key].replace("{n}",N).replace("{k}",Math.min(k+1,N))}
function applyLang(l){LANG=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=tr(e.dataset.i));
 $("why").placeholder=tr("why_ph");document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("sel",b.dataset.lang===l));
 $("cred").replaceChildren(...CREDITS[l].map(c=>{const p=document.createElement("p");p.textContent=c;return p}));
 if(!$("run").hidden)$("cnt").textContent=tr("pair");}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));
const ids=t=>{const p=PAIRS[t.pi];return t.sw?[p.b,p.a]:[p.a,p.b]};
const src=i=>"img/"+i+".jpg";
function show(){const [l,r]=ids(seq[k]);$("imL").src=src(l);$("imR").src=src(r);
 if(k+1<N)ids(seq[k+1]).forEach(i=>{new Image().src=src(i)}); // preload next pair
 $("cnt").textContent=tr("pair");$("prog").value=k/N;ans={};$("why").value="";
 document.querySelectorAll(".opts button").forEach(b=>b.classList.remove("sel"));$("next").disabled=true;t0=performance.now();window.scrollTo(0,0);}
function pick(q,v){ans[q]=v;document.querySelectorAll(`.opts[data-q=${q}] button`).forEach(b=>b.classList.toggle("sel",b.dataset.v===v));
 $("next").disabled=!(ans.real&&ans.arch);}
document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>pick(b.parentElement.dataset.q,b.dataset.v));
function consistency(){const out=[];S.a.filter(x=>x.rep).forEach(x=>{const o=S.a.find(y=>y.p===x.p&&!y.rep);
 if(o)out.push({p:x.p,real:o.rw===x.rw,arch:o.aw===x.aw})});return out}
function payload(stage){S.stage=stage;S.n=N;S.done=S.a.length;S.ts=new Date().toISOString();S.lang=LANG;S.hp=$("hp").value?1:0;S.cons=consistency();
 let s=JSON.stringify(S);
 if(s.length>MAXB){const c=JSON.parse(s);for(let lim=120;s.length>MAXB&&lim>=0;lim-=40){c.a.forEach(x=>{x.w=(x.w||"").slice(0,lim)});c.trunc=1;s=JSON.stringify(c)}}
 return s}
async function submit(stage){const body=new URLSearchParams();const s=payload(stage);body.set(FIELD,s);$("code").value=s;
 if(navigator.onLine===false)return false;
 try{await fetch(FORM,{method:"POST",mode:"no-cors",body,keepalive:s.length<60000});return true}catch(e){return false}}
async function finish(){$("run").hidden=true;$("done").hidden=false;$("status").textContent=tr("sending");
 S.end=new Date().toISOString();const ok=await submit("final");
 $("status").textContent=ok?tr("sent"):"";$("fallback").hidden=ok;}
function next(){if(!(ans.real&&ans.arch))return;const t=seq[k],p=PAIRS[t.pi],[l,r]=ids(t),w=v=>v==="L"?l:r;
 S.a.push({p:p.id,l,r,rw:w(ans.real),aw:w(ans.arch),ms:Math.round(performance.now()-t0),w:$("why").value.trim().slice(0,300),k,rep:t.rep,lg:LANG});
 k++;if(CHECKPOINTS.includes(k)&&k<N)submit("p"+k);
 if(k>=N)finish();else show();}
$("next").onclick=next;
$("start").onclick=()=>{S.bg={prof:$("prof").value,exp:$("exp").value};$("intro").hidden=true;$("run").hidden=false;show();};
document.addEventListener("keydown",e=>{if($("run").hidden||!$("zoom").hidden||e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
 if(e.key==="1"||e.key==="2"){pick(!ans.real?"real":"arch",e.key==="1"?"L":"R")}else if(e.key==="Enter"){next()}});
$("copy").onclick=async()=>{$("code").select();try{await navigator.clipboard.writeText($("code").value)}catch(e){document.execCommand&&document.execCommand("copy")}$("copy").textContent=tr("copied")};
$("retry").onclick=async()=>{const ok=await submit("final");$("status").textContent=ok?tr("sent"):"";$("fallback").hidden=ok};

// tap-to-zoom: full-screen viewer, pinch / wheel zoom from "fit" up to 4x native pixels, 1:1 = one image px per device px
const Z={s:1,fit:1,nat:1};
function zset(scale,cx,cy){const z=$("zoom"),im=$("zimg"),old=Z.s;Z.s=Math.min(Math.max(scale,Z.fit),Z.nat*4);
 const W=im.naturalWidth*Z.s;im.style.width=W+"px";
 im.style.marginTop=Math.max(0,(innerHeight-im.naturalHeight*Z.s)/2)+"px";
 if(cx!==undefined){const r=Z.s/old;z.scrollLeft=(z.scrollLeft+cx)*r-cx;z.scrollTop=(z.scrollTop+cy)*r-cy}}
function zopen(img,label){const im=$("zimg");im.onload=()=>{Z.fit=Math.min(innerWidth/im.naturalWidth,innerHeight/im.naturalHeight);Z.nat=1/(devicePixelRatio||1);Z.s=Z.fit;zset(Z.fit)};
 im.src=img.src;$("zlab").textContent=label;["zoom","zbar","zlab"].forEach(i=>$(i).hidden=false);document.body.style.overflow="hidden";if(im.complete&&im.naturalWidth)im.onload();}
function zclose(){["zoom","zbar","zlab"].forEach(i=>$(i).hidden=true);document.body.style.overflow="";$("zimg").removeAttribute("src")}
$("imL").onclick=()=>zopen($("imL"),"1");$("imR").onclick=()=>zopen($("imR"),"2");
$("zx").onclick=zclose;$("zfit").onclick=()=>zset(Z.fit);$("z11").onclick=()=>zset(Z.nat,innerWidth/2,innerHeight/2);
$("zoom").addEventListener("wheel",e=>{if(!e.ctrlKey&&!e.metaKey)return;e.preventDefault();zset(Z.s*Math.exp(-e.deltaY/300),e.clientX,e.clientY)},{passive:false});
let pin=null;const P=new Map();
$("zoom").addEventListener("pointerdown",e=>{P.set(e.pointerId,e);if(P.size===2){const[a,b]=[...P.values()];pin={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),s:Z.s}}});
$("zoom").addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,e);if(pin&&P.size===2){const[a,b]=[...P.values()];
 zset(pin.s*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pin.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);pin.s=Z.s;pin.d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
["pointerup","pointercancel","pointerleave"].forEach(t=>$("zoom").addEventListener(t,e=>{P.delete(e.pointerId);if(P.size<2)pin=null}));
let lastTap=0;$("zimg").addEventListener("click",e=>{const n=Date.now();if(n-lastTap<350){zset(Z.s>Z.fit*1.05?Z.fit:Z.nat,e.clientX,e.clientY)}lastTap=n});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("zoom").hidden)zclose()},true);
applyLang(LANG);
</script></body></html>
